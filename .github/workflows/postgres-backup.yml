name: PostgreSQL backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create encrypted backup
        run: ./scripts/backup-postgres.sh filet-pattern-${GITHUB_RUN_ID}.sql.gz.enc
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: filet-pattern-postgres-${{ github.run_id }}
          path: filet-pattern-${{ github.run_id }}.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
