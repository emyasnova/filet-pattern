name: PostgreSQL backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    container: postgres:17-bookworm
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install backup utilities
        run: apt-get update && apt-get install --yes --no-install-recommends gzip openssl
      - name: Check PostgreSQL client version
        run: pg_dump --version
      - name: Create encrypted backup
        run: ./scripts/backup-postgres.sh filet-pattern-${GITHUB_RUN_ID}.sql.gz.enc
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: filet-pattern-postgres-${{ github.run_id }}
          path: filet-pattern-${{ github.run_id }}.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
